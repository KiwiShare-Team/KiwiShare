name: Release & Publish Pipeline

on:
  push:
    branches:
      - main
      - pre
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Calculate Version, Changelog & Tag
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump_version.outputs.new_tag }}
      new_version: ${{ steps.bump_version.outputs.new_version }}
      changelog: ${{ steps.bump_version.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump Version and Generate Changelog
        id: bump_version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${{ github.ref_name }}" = "pre" ]; then
            npx standard-version --prerelease pre --releaseCommitMessageFormat "chore(release): {{currentTag}} [skip ci]"
          else
            npx standard-version --releaseCommitMessageFormat "chore(release): {{currentTag}} [skip ci]"
          fi

          NEW_TAG=$(git describe --tags --abbrev=0)
          NEW_VERSION=$(node -p "require('./package.json').version")

          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

          node -e '
            const fs = require("fs");
            const content = fs.existsSync("CHANGELOG.md") ? fs.readFileSync("CHANGELOG.md", "utf8") : "";
            const match = content.match(/## \[?[\d\w\.-]+\]?[\s\S]*?(?=\n## \[?[\d\w\.-]+\]?|$)/);
            const notes = match ? match[0].trim() : "See CHANGELOG.md for details.";
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `changelog<<EOF\n${notes}\nEOF\n`);
          '

          git push --follow-tags origin ${{ github.ref_name }}

  build_android:
    name: Build Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Android APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Stage Android Artifacts
        run: |
          mkdir -p build_output
          cp mobile/build/app/outputs/flutter-apk/app-release.apk build_output/KiwiShare-Android-${{ needs.version.outputs.new_tag }}.apk
          cp mobile/build/app/outputs/flutter-apk/app-release.apk build_output/app-release.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build_output/

  build_ios:
    name: Build iOS Package
    needs: version
    runs-on: macos-latest
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build iOS Application (No Codesign)
        run: |
          flutter config --no-enable-swift-package-manager
          cd mobile
          flutter build ios --release --no-codesign

      - name: Package iOS App Bundle
        run: |
          mkdir -p build_output
          cd mobile/build/ios/iphoneos
          zip -r "$GITHUB_WORKSPACE/build_output/KiwiShare-iOS-${{ needs.version.outputs.new_tag }}.zip" Runner.app

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-package
          path: build_output/

  publish_release:
    name: Publish Release & Distribute
    needs: [version, build_android, build_ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./release-assets

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-package
          path: ./release-assets

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: Release ${{ needs.version.outputs.new_tag }}
          body: ${{ needs.version.outputs.changelog }}
          files: |
            ./release-assets/KiwiShare-Android-${{ needs.version.outputs.new_tag }}.apk
            ./release-assets/KiwiShare-iOS-${{ needs.version.outputs.new_tag }}.zip
          draft: false
          prerelease: ${{ github.ref_name == 'pre' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Firebase App Distribution
        if: ${{ env.FIREBASE_TOKEN != '' && env.FIREBASE_APP_ID != '' }}
        uses: w9jds/firebase-action@v2.0.0
        with:
          args: appdistribution:distribute release-assets/app-release.apk --app ${{ secrets.FIREBASE_APP_ID }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
