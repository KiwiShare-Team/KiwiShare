name: Release & Publish Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Calculate Version, Changelog & Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.bump_version.outputs.new_tag }}
      new_version: ${{ steps.bump_version.outputs.new_version }}
      changelog: ${{ steps.bump_version.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump Version and Generate Changelog
        id: bump_version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --tags origin

          # Check if the version in package.json already has a remote tag
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_TAG="v$PKG_VERSION"
          REMOTE_TAG_EXISTS=$(git ls-remote --tags origin "refs/tags/$PKG_TAG" | wc -l)

          if [ "$REMOTE_TAG_EXISTS" -eq "0" ]; then
            echo "Version $PKG_VERSION in package.json is not tagged yet. Using $PKG_TAG."
            NEW_VERSION="$PKG_VERSION"
            NEW_TAG="$PKG_TAG"
            git tag "$NEW_TAG"
          else
            echo "Version $PKG_VERSION is already tagged. Calculating next version..."
            if [ "${{ github.ref_name }}" = "pre" ]; then
              pnpm exec standard-version --prerelease pre --skip.commit --skip.tag
            else
              pnpm exec standard-version --skip.commit --skip.tag
            fi
            NEW_VERSION=$(node -p "require('./package.json').version")
            NEW_TAG="v$NEW_VERSION"
            git tag "$NEW_TAG"
          fi

          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

          node -e '
            const fs = require("fs");
            const content = fs.existsSync("CHANGELOG.md") ? fs.readFileSync("CHANGELOG.md", "utf8") : "";
            const match = content.match(/## \[?[\d\w\.-]+\]?[\s\S]*?(?=\n## \[?[\d\w\.-]+\]?|$)/);
            const notes = match ? match[0].trim() : "See CHANGELOG.md for details.";
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `changelog<<EOF\n${notes}\nEOF\n`);
          '

          # Push ONLY the tag to origin. Never push directly to protected branch main.
          git push origin "refs/tags/$NEW_TAG"

  build_android:
    name: Build Android APK
    needs: version
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          flutter-version: '3.44.8'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get --enforce-lockfile

      - name: Configure Android release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/app/release-keystore.jks
          cat > mobile/android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/release-keystore.jks
          EOF

      - name: Build Android APK
        run: |
          cd mobile
          flutter build apk --release \
            --build-name "${{ needs.version.outputs.new_version }}" \
            --build-number "${{ github.run_number }}"

      - name: Stage Android Artifacts
        run: |
          mkdir -p build_output
          cp mobile/build/app/outputs/flutter-apk/app-release.apk build_output/KiwiShare-Android-${{ needs.version.outputs.new_tag }}.apk
          cp mobile/build/app/outputs/flutter-apk/app-release.apk build_output/app-release.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: build_output/

  build_ios:
    name: Build iOS Package
    needs: version
    runs-on: macos-latest
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          flutter-version: '3.44.8'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get --enforce-lockfile

      - name: Build iOS Application (No Codesign)
        run: |
          flutter config --no-enable-swift-package-manager
          cd mobile
          flutter build ios --release --no-codesign

      - name: Package iOS App Bundle
        run: |
          mkdir -p build_output
          cd mobile/build/ios/iphoneos
          zip -r "$GITHUB_WORKSPACE/build_output/KiwiShare-iOS-${{ needs.version.outputs.new_tag }}.zip" Runner.app

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-package
          path: build_output/

  publish_release:
    name: Publish Release & Distribute
    needs: [version, build_android, build_ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download Android Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-apk
          path: ./release-assets

      - name: Download iOS Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-package
          path: ./release-assets

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: Release ${{ needs.version.outputs.new_tag }}
          body: ${{ needs.version.outputs.changelog }}
          files: |
            ./release-assets/KiwiShare-Android-${{ needs.version.outputs.new_tag }}.apk
            ./release-assets/KiwiShare-iOS-${{ needs.version.outputs.new_tag }}.zip
          draft: false
          prerelease: ${{ github.ref_name == 'pre' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Firebase App Distribution
        if: ${{ env.FIREBASE_TOKEN != '' && env.FIREBASE_APP_ID != '' }}
        uses: w9jds/firebase-action@0a5173f97c956332c9e71750526e0ca6f38cbe3a # v2.0.0
        with:
          args: appdistribution:distribute release-assets/app-release.apk --app ${{ secrets.FIREBASE_APP_ID }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

  sync_main_to_pre:
    name: Create Sync PR (main -> pre)
    needs: [version, publish_release]
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check and Create Sync PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              // 1. Check if an open PR from main to pre already exists
              const { data: existingPrs } = await octokit.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:main`,
                base: 'pre',
              });

              if (existingPrs.length > 0) {
                console.log(`Sync PR already open: #${existingPrs[0].number} (${existingPrs[0].html_url})`);
                return;
              }

              // 2. Compare pre with main to verify if main has new commits
              const { data: comparison } = await octokit.rest.repos.compareCommits({
                owner,
                repo,
                base: 'pre',
                head: 'main',
              });

              if (comparison.ahead_by === 0) {
                console.log('Branch pre is already up to date with main. No PR needed.');
                return;
              }

              // 3. Create the sync PR
              const prBody = [
                '### 🔄 Automatic Sync: `main` ➡️ `pre`',
                '',
                'This PR was automatically created after a new release was published on `main`.',
                'It merges latest release tags, changelog, and production metadata back to `pre` to prevent branch divergence.',
                '',
                `- **Ahead by**: ${comparison.ahead_by} commit(s)`,
                `- **Release Version**: \`${{ needs.version.outputs.new_tag }}\``,
                `- **Triggered by**: \`${context.sha}\``,
                '',
                'Please merge this PR to keep `pre` up to date!'
              ].join('\n');

              const pr = await octokit.rest.pulls.create({
                owner,
                repo,
                title: `chore(sync): merge main (${{ needs.version.outputs.new_tag }}) back to pre [skip ci]`,
                head: 'main',
                base: 'pre',
                body: prBody,
              });

              console.log(`Successfully created sync PR #${pr.data.number}: ${pr.data.html_url}`);
            } catch (error) {
              console.warn('Warning: Could not create sync PR automatically:', error.message);
              const compareUrl = `https://github.com/${owner}/${repo}/compare/pre...main?expand=1`;
              await core.summary
                .addHeading('🔄 Sync Notice: main ➡️ pre')
                .addRaw(`GitHub Actions does not have permission to automatically create Pull Requests in this repository.\n\n`)
                .addRaw(`Please create the sync PR manually using the link below:\n\n`)
                .addRaw(`👉 **[Click here to open PR: \`main\` ➡️ \`pre\`](${compareUrl})**\n`)
                .write();
            }
