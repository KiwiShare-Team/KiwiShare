name: Release & Publish Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android_release_preflight:
    name: Validate Android Production Signing
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Require Android signing secrets
        shell: bash
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required production signing secret is missing: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Android production signing secrets are configured."

  version:
    name: Calculate Version & Changelog
    needs: android_release_preflight
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump_version.outputs.new_tag }}
      new_version: ${{ steps.bump_version.outputs.new_version }}
      changelog: ${{ steps.bump_version.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate unique release version and changelog
        id: bump_version
        shell: bash
        run: |
          set -euo pipefail

          # Release tags are the source of truth. package.json can lag behind
          # because the release workflow must not mutate main after a merge.
          git fetch --force --tags origin

          # A rerun for the same commit may reuse only the tag that already
          # points at this exact SHA. A different commit must get a new tag.
          EXISTING_TAG=$(git tag --points-at "$GITHUB_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)

          if [ -n "$EXISTING_TAG" ]; then
            NEW_TAG="$EXISTING_TAG"
            NEW_VERSION="${NEW_TAG#v}"
            echo "Commit $GITHUB_SHA is already tagged as $NEW_TAG; treating this as a same-SHA rerun."
          else
            LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)

            if [ -z "$LATEST_TAG" ]; then
              NEW_VERSION="0.1.0"
            else
              LATEST_VERSION="${LATEST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi

            NEW_TAG="v$NEW_VERSION"

            # A new commit must never publish into an existing tag/release.
            if git ls-remote --exit-code --tags origin "refs/tags/$NEW_TAG" >/dev/null 2>&1; then
              echo "::error::Refusing to reuse existing release tag $NEW_TAG for commit $GITHUB_SHA."
              exit 1
            fi
          fi

          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          PREVIOUS_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -Fxv "$NEW_TAG" | head -n 1 || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            NOTES=$(git log --no-merges --pretty=format:'- %s (%h)' "$PREVIOUS_TAG..$GITHUB_SHA")
          else
            NOTES=$(git log --no-merges --pretty=format:'- %s (%h)' "$GITHUB_SHA")
          fi

          if [ -z "$NOTES" ]; then
            NOTES="Release $NEW_TAG from $GITHUB_SHA."
          fi

          {
            echo 'changelog<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build_android:
    name: Build Production Android APK & AAB
    needs: version
    runs-on: ubuntu-latest
    env:
      # Keep Gradle stable and reusable on ephemeral GitHub-hosted runners.
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false -Dorg.gradle.caching=true
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/gradle/wrapper/gradle-wrapper.properties
            mobile/pubspec.lock

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get --enforce-lockfile

      - name: Configure Android release signing
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/app/release-keystore.jks
          cat > mobile/android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/release-keystore.jks
          EOF

          keytool -list \
            -keystore mobile/android/app/release-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build production Android APK
        run: |
          cd mobile
          flutter build apk --release --no-pub \
            --build-name "${{ needs.version.outputs.new_version }}" \
            --build-number "${{ github.run_number }}"

      - name: Build production Android App Bundle
        run: |
          cd mobile
          flutter build appbundle --release --no-pub \
            --build-name "${{ needs.version.outputs.new_version }}" \
            --build-number "${{ github.run_number }}"

      - name: Verify Android release signatures
        shell: bash
        run: |
          BUILD_TOOLS_VERSION="$(ls -1 "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -n 1)"
          APK_SIGNER="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          "$APK_SIGNER" verify --verbose --print-certs \
            mobile/build/app/outputs/flutter-apk/app-release.apk
          jarsigner -verify \
            mobile/build/app/outputs/bundle/release/app-release.aab

      - name: Stage Android Artifacts
        run: |
          mkdir -p build_output
          cp mobile/build/app/outputs/flutter-apk/app-release.apk build_output/KiwiShare-Android-${{ needs.version.outputs.new_tag }}.apk
          cp mobile/build/app/outputs/bundle/release/app-release.aab build_output/KiwiShare-Android-${{ needs.version.outputs.new_tag }}.aab
          cp mobile/build/app/outputs/flutter-apk/app-release.apk build_output/app-release.apk
          cp mobile/build/app/outputs/bundle/release/app-release.aab build_output/app-release.aab

      - name: Upload Android Production Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-production
          path: build_output/

  publish_release:
    name: Publish Release & Distribute
    if: ${{ github.ref_name == 'main' }}
    needs: [version, build_android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download Android Production Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-production
          path: ./release-assets

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.version.outputs.new_tag }}
          body: ${{ needs.version.outputs.changelog }}
          files: |
            ./release-assets/KiwiShare-Android-${{ needs.version.outputs.new_tag }}.apk
            ./release-assets/KiwiShare-Android-${{ needs.version.outputs.new_tag }}.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published tag matches this build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.new_tag }}
        run: |
          set -euo pipefail
          TAG_TYPE=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.type')
          TAG_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')

          if [ "$TAG_TYPE" = "tag" ]; then
            TAG_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_SHA}" --jq '.object.sha')
          fi

          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag $RELEASE_TAG points to $TAG_SHA, but this build came from $GITHUB_SHA."
            exit 1
          fi

          echo "Verified $RELEASE_TAG -> $GITHUB_SHA."

      - name: Upload to Firebase App Distribution
        if: ${{ env.FIREBASE_TOKEN != '' && env.FIREBASE_APP_ID != '' }}
        uses: w9jds/firebase-action@0a5173f97c956332c9e71750526e0ca6f38cbe3a # v2.0.0
        with:
          args: appdistribution:distribute release-assets/app-release.apk --app ${{ secrets.FIREBASE_APP_ID }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

  sync_main_to_pre:
    name: Create Sync PR (main -> pre)
    needs: [version, publish_release]
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check and Create Sync PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              // 1. Check if an open PR from main to pre already exists
              const { data: existingPrs } = await octokit.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:main`,
                base: 'pre',
              });

              if (existingPrs.length > 0) {
                console.log(`Sync PR already open: #${existingPrs[0].number} (${existingPrs[0].html_url})`);
                return;
              }

              // 2. Compare pre with main to verify if main has new commits
              const { data: comparison } = await octokit.rest.repos.compareCommits({
                owner,
                repo,
                base: 'pre',
                head: 'main',
              });

              if (comparison.ahead_by === 0) {
                console.log('Branch pre is already up to date with main. No PR needed.');
                return;
              }

              // 3. Create the sync PR
              const prBody = [
                '### 🔄 Automatic Sync: `main` ➡️ `pre`',
                '',
                'This PR was automatically created after a new release was published on `main`.',
                'It merges latest release tags, changelog, and production metadata back to `pre` to prevent branch divergence.',
                '',
                `- **Ahead by**: ${comparison.ahead_by} commit(s)`,
                `- **Release Version**: \`${{ needs.version.outputs.new_tag }}\``,
                `- **Triggered by**: \`${context.sha}\``,
                '',
                'Please merge this PR to keep `pre` up to date!'
              ].join('\n');

              const pr = await octokit.rest.pulls.create({
                owner,
                repo,
                title: `chore(sync): merge main (${{ needs.version.outputs.new_tag }}) back to pre [skip ci]`,
                head: 'main',
                base: 'pre',
                body: prBody,
              });

              console.log(`Successfully created sync PR #${pr.data.number}: ${pr.data.html_url}`);
            } catch (error) {
              console.warn('Warning: Could not create sync PR automatically:', error.message);
              const compareUrl = `https://github.com/${owner}/${repo}/compare/pre...main?expand=1`;
              await core.summary
                .addHeading('🔄 Sync Notice: main ➡️ pre')
                .addRaw(`GitHub Actions does not have permission to automatically create Pull Requests in this repository.\n\n`)
                .addRaw(`Please create the sync PR manually using the link below:\n\n`)
                .addRaw(`👉 **[Click here to open PR: \`main\` ➡️ \`pre\`](${compareUrl})**\n`)
                .write();
            }
