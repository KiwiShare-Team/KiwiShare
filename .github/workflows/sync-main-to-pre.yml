name: Sync Main Back to Pre

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  sync_main_to_pre:
    name: Create Sync PR (main -> pre)
    runs-on: ubuntu-latest
    steps:
      - name: Check and Create Sync PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              // 1. Check if an open PR from main to pre already exists
              const { data: existingPrs } = await octokit.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:main`,
                base: 'pre',
              });

              if (existingPrs.length > 0) {
                console.log(`Sync PR already open: #${existingPrs[0].number} (${existingPrs[0].html_url})`);
                return;
              }

              // 2. Compare pre with main to verify if main has new commits
              const { data: comparison } = await octokit.rest.repos.compareCommits({
                owner,
                repo,
                base: 'pre',
                head: 'main',
              });

              if (comparison.ahead_by === 0) {
                console.log('Branch pre is already up to date with main. No PR needed.');
                return;
              }

              // 3. Create the sync PR
              const prBody = [
                '### 🔄 Automatic Sync: `main` ➡️ `pre`',
                '',
                'This PR was automatically created after `main` was updated.',
                'It merges latest release tags, metadata, and production changes back to `pre` to prevent branch divergence.',
                '',
                `- **Ahead by**: ${comparison.ahead_by} commit(s)`,
                `- **Triggered by**: \`${context.sha}\``,
                '',
                'Please merge this PR to keep `pre` up to date!'
              ].join('\n');

              const pr = await octokit.rest.pulls.create({
                owner,
                repo,
                title: 'chore(sync): merge main back to pre [skip ci]',
                head: 'main',
                base: 'pre',
                body: prBody,
              });

              console.log(`Successfully created sync PR #${pr.data.number}: ${pr.data.html_url}`);
            } catch (error) {
              console.warn('Warning: Could not create sync PR automatically:', error.message);
              const compareUrl = `https://github.com/${owner}/${repo}/compare/pre...main?expand=1`;
              await core.summary
                .addHeading('🔄 Sync Notice: main ➡️ pre')
                .addRaw(`GitHub Actions does not have permission to automatically create Pull Requests in this repository.\n\n`)
                .addRaw(`Please create the sync PR manually using the link below:\n\n`)
                .addRaw(`👉 **[Click here to open PR: \`main\` ➡️ \`pre\`](${compareUrl})**\n`)
                .write();
            }
